<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Container with rounded bottom-right corner matching the PLUS block -->
  <path d="M 12 12 L 108 12 L 108 72 Q 108 108 68 108 L 12 108 Z" fill="#0B192C" />
  
  <!-- 3D White PLUS (+) Symbol at Center -->
  <g transform="translate(60, 56)">
    <!-- 3D Shadow -->
    <path d="M -7 -30 L 7 -30 L 7 -10 L 27 -10 L 27 4 L 7 4 L 7 24 L -7 24 L -7 4 L -27 4 L -27 -10 L -7 -10 Z" fill="#050C16" stroke="#050C16" stroke-width="8" stroke-linejoin="round" transform="translate(4, 5)" />
    <!-- White Body -->
    <path d="M -7 -30 L 7 -30 L 7 -10 L 27 -10 L 27 4 L 7 4 L 7 24 L -7 24 L -7 4 L -27 4 L -27 -10 L -7 -10 Z" fill="#FFFFFF" stroke="#0B192C" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Vibrant Orange Accent Bar at the bottom -->
  <rect x="24" y="96" width="46" height="5" rx="2.5" fill="#FF6B00" />
</svg>
